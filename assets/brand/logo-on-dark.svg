<?xml version="1.0" encoding="UTF-8"?>
<!--
  TopoSmith 标准字标（横版组合）—— **深色背景**版本（字为浅色）

  与 logo-on-light.svg 只差两处颜色（字色与字标渐变）。拆两份是因为 README 在 GitHub 的
  浅色 / 深色主题下都要能看，而 GitHub 的图片会经过代理与缓存 —— 用 <picture> + media
  选择主题是可靠且通行的做法（SVG 内部的媒体查询在部分客户端不生效）。

  图形标识用**嵌套 svg + viewBox** 复用几何：数字与 mark.svg 逐字一致，
  改一处不会与 favicon 走样。字标用系统字体栈渲染（不轮廓化），因此排版只依赖
  "基线 + 字号"，"Topo/Smith" 用 tspan 自然接排，不写任何量出来的 x 坐标。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452 128" width="452" height="128"
     role="img" aria-label="TopoSmith — 浏览器内的网络拓扑推演器">
  <defs>
    <linearGradient id="ts-badge" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111c30"/>
      <stop offset="1" stop-color="#04070f"/>
    </linearGradient>
    <linearGradient id="ts-rim" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="ts-wire" x1="9" y1="12" x2="55" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="ts-wire-text" x1="146" y1="28" x2="372" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- 图形标识（与 mark.svg 同几何，仅缩放） -->
  <svg x="6" y="6" width="116" height="116" viewBox="0 0 64 64">
    <polygon points="32,0.6 59.4,16.4 59.4,47.6 32,63.4 4.6,47.6 4.6,16.4" fill="url(#ts-badge)"/>
    <polygon points="32,3.4 57,17.9 57,46.1 32,60.6 7,46.1 7,17.9" fill="none" stroke="url(#ts-rim)" stroke-width="1.6"/>
    <g fill="none" stroke="url(#ts-wire)" stroke-width="4.8" stroke-linecap="round">
      <path d="M13.5 22 Q22.5 26 31.5 22"/>
      <path d="M32.5 22 Q41.5 26 50.5 22"/>
      <path d="M32 23.5 V42.5"/>
    </g>
    <rect x="25.8" y="15.8" width="12.4" height="12.4" rx="4" fill="url(#ts-wire)"/>
    <g fill="url(#ts-wire)">
      <circle cx="13.5" cy="22" r="4.5"/>
      <circle cx="50.5" cy="22" r="4.5"/>
      <circle cx="32" cy="42.5" r="4.5"/>
    </g>
  </svg>

  <!-- 字标 -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
    <text x="142" y="66" font-size="46" font-weight="700" letter-spacing="-1.2">
      <tspan fill="#f8fafc">Topo</tspan><tspan fill="url(#ts-wire-text)">Smith</tspan>
    </text>
    <text x="144" y="95" font-size="15" font-weight="500" fill="#94a3b8">
      拓扑匠 · 网络拓扑推演器
    </text>
  </g>
</svg>
