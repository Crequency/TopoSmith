<?xml version="1.0" encoding="UTF-8"?>
<!--
  TopoSmith 标准字标（横版组合）—— **深色背景**版本（字为浅色）

  与 logo-on-light.svg 只差两处颜色（字色与字标渐变）。之所以拆成两个文件而不是
  在 SVG 内部写 prefers-color-scheme：README 在 GitHub 的浅色/深色主题下都要能看，
  而 GitHub 的图片会经过代理与缓存，内联媒体查询在部分客户端不生效；
  用 <picture> + media 选择是可靠且通行的做法。

  图形标识用**嵌套 svg + viewBox** 内联（不是复制一份放大过的坐标）：
  几何数字与 mark.svg 保持逐字一致，改一处不会与 favicon 走样。
  字形用系统字体栈渲染、不做轮廓化：文案仍可编辑，代价是换机器字宽略有差异，
  因此排版只依赖"基线 + 字号"，"Topo/Smith" 用 tspan 自然接排，不写任何量出来的 x 坐标。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 128" width="450" height="128"
     role="img" aria-label="TopoSmith — 浏览器内的网络拓扑推演器">
  <defs>
    <linearGradient id="ts-wire" x1="6" y1="10" x2="58" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="ts-wire-text" x1="146" y1="28" x2="360" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- 图形标识（与 mark.svg 同几何，仅缩放） -->
  <svg x="4" y="4" width="120" height="120" viewBox="0 0 64 64">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#020617"/>
    <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#1e293b" stroke-width="2"/>
    <g fill="none" stroke="url(#ts-wire)" stroke-width="4.4" stroke-linecap="round">
      <path d="M12 18.5 H52"/>
      <path d="M32 18.5 V45.5"/>
    </g>
    <g fill="url(#ts-wire)">
      <rect x="7.6" y="14.1" width="8.8" height="8.8" rx="2.4"/>
      <rect x="47.6" y="14.1" width="8.8" height="8.8" rx="2.4"/>
      <rect x="27.6" y="41.1" width="8.8" height="8.8" rx="2.4"/>
      <circle cx="32" cy="18.5" r="8.4"/>
    </g>
  </svg>

  <!-- 字标 -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="146" y="66" font-size="46" font-weight="700" letter-spacing="-1">
      <tspan fill="#f8fafc">Topo</tspan><tspan fill="url(#ts-wire-text)">Smith</tspan>
    </text>
    <text x="148" y="95" font-size="15" font-weight="500" fill="#94a3b8">
      拓扑匠 · 网络拓扑推演器
    </text>
  </g>
</svg>
